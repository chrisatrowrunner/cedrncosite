<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylized view of Porto, Portugal">
  <defs>
    <linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c98a"/>
      <stop offset="0.5" stop-color="#e39a5c"/>
      <stop offset="1" stop-color="#b9603a"/>
    </linearGradient>
    <linearGradient id="pRiver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5a54"/>
      <stop offset="1" stop-color="#3f2f34"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#pSky)"/>
  <circle cx="880" cy="210" r="70" fill="#fce3b8" opacity="0.85"/>
  <!-- distant hills -->
  <path d="M0 470 Q300 420 600 460 T1200 450 V560 H0 Z" fill="#a5623c" opacity="0.6"/>
  <!-- stacked riverside houses climbing the hill -->
  <g fill="#c8794a">
    <rect x="40" y="430" width="90" height="150"/><rect x="140" y="400" width="80" height="180"/>
    <rect x="230" y="370" width="95" height="210"/><rect x="335" y="410" width="85" height="170"/>
    <rect x="430" y="440" width="90" height="140"/>
  </g>
  <g fill="#d98f5c">
    <rect x="95" y="455" width="60" height="125"/><rect x="290" y="405" width="55" height="175"/>
    <rect x="470" y="470" width="55" height="110"/>
  </g>
  <!-- roofs -->
  <g fill="#8a3f2a">
    <polygon points="40,430 85,398 130,430"/><polygon points="140,400 180,368 220,400"/>
    <polygon points="230,370 277,336 325,370"/><polygon points="335,410 377,380 420,410"/>
    <polygon points="430,440 475,412 520,440"/>
  </g>
  <!-- windows -->
  <g fill="#f4c98a" opacity="0.85">
    <rect x="58" y="460" width="14" height="20"/><rect x="90" y="460" width="14" height="20"/>
    <rect x="58" y="500" width="14" height="20"/><rect x="90" y="500" width="14" height="20"/>
    <rect x="160" y="428" width="14" height="20"/><rect x="192" y="428" width="14" height="20"/>
    <rect x="252" y="400" width="14" height="22"/><rect x="288" y="400" width="14" height="22"/>
    <rect x="252" y="445" width="14" height="22"/><rect x="288" y="445" width="14" height="22"/>
    <rect x="352" y="440" width="13" height="20"/><rect x="386" y="440" width="13" height="20"/>
  </g>
  <!-- Dom Luís I double-deck iron bridge -->
  <g stroke="#4a3330" stroke-width="7" fill="none" opacity="0.9">
    <path d="M690 470 Q900 300 1140 470"/>
    <line x1="690" y1="470" x2="1140" y2="470"/>
    <line x1="700" y1="405" x2="1130" y2="405"/>
  </g>
  <g stroke="#4a3330" stroke-width="4" opacity="0.8">
    <line x1="760" y1="405" x2="760" y2="470"/><line x1="830" y1="360" x2="830" y2="470"/>
    <line x1="915" y1="345" x2="915" y2="470"/><line x1="1000" y1="360" x2="1000" y2="470"/>
    <line x1="1070" y1="405" x2="1070" y2="470"/>
  </g>
  <!-- river -->
  <rect x="0" y="560" width="1200" height="240" fill="url(#pRiver)"/>
  <g stroke="#e39a5c" stroke-width="3" opacity="0.35">
    <line x1="80" y1="600" x2="320" y2="600"/><line x1="500" y1="640" x2="820" y2="640"/>
    <line x1="200" y1="690" x2="560" y2="690"/>
  </g>
</svg>
