<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylized skyline of New York City">
  <defs>
    <linearGradient id="nSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba0b8"/>
      <stop offset="0.5" stop-color="#5b7089"/>
      <stop offset="1" stop-color="#2f3f52"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#nSky)"/>
  <circle cx="940" cy="200" r="66" fill="#e9eef3" opacity="0.55"/>
  <!-- back layer -->
  <g fill="#3f5266" opacity="0.9">
    <rect x="0" y="360" width="90" height="440"/><rect x="100" y="300" width="70" height="500"/>
    <rect x="185" y="400" width="100" height="400"/><rect x="1010" y="330" width="80" height="470"/>
    <rect x="1100" y="380" width="100" height="420"/>
  </g>
  <!-- mid layer -->
  <g fill="#2f4256">
    <rect x="300" y="330" width="90" height="470"/><rect x="405" y="380" width="70" height="420"/>
    <rect x="490" y="300" width="85" height="500"/><rect x="720" y="350" width="90" height="450"/>
    <rect x="825" y="300" width="80" height="500"/><rect x="920" y="380" width="70" height="420"/>
  </g>
  <!-- Empire State-style central spire -->
  <g fill="#243545">
    <rect x="588" y="250" width="120" height="550"/>
    <rect x="612" y="180" width="72" height="80"/>
    <rect x="632" y="120" width="32" height="70"/>
    <rect x="644" y="70" width="8" height="60"/>
    <polygon points="648,44 640,72 656,72"/>
  </g>
  <!-- setbacks -->
  <g fill="#2f4256">
    <rect x="568" y="330" width="20" height="470"/><rect x="708" y="330" width="20" height="470"/>
  </g>
  <!-- window grid -->
  <g fill="#cdd8e2" opacity="0.55">
    <rect x="606" y="280" width="10" height="18"/><rect x="628" y="280" width="10" height="18"/><rect x="650" y="280" width="10" height="18"/><rect x="672" y="280" width="10" height="18"/>
    <rect x="606" y="320" width="10" height="18"/><rect x="628" y="320" width="10" height="18"/><rect x="672" y="320" width="10" height="18"/>
    <rect x="606" y="360" width="10" height="18"/><rect x="650" y="360" width="10" height="18"/><rect x="672" y="360" width="10" height="18"/>
    <rect x="606" y="400" width="10" height="18"/><rect x="628" y="400" width="10" height="18"/><rect x="650" y="400" width="10" height="18"/>
    <rect x="628" y="440" width="10" height="18"/><rect x="672" y="440" width="10" height="18"/>
  </g>
  <g fill="#f2c96a" opacity="0.7">
    <rect x="320" y="360" width="10" height="16"/><rect x="352" y="400" width="10" height="16"/>
    <rect x="510" y="340" width="10" height="16"/><rect x="540" y="380" width="10" height="16"/>
    <rect x="742" y="390" width="10" height="16"/><rect x="845" y="340" width="10" height="16"/>
    <rect x="120" y="360" width="10" height="16"/><rect x="1030" y="380" width="10" height="16"/>
  </g>
</svg>
