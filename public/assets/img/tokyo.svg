<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylized view of Tokyo, Japan">
  <defs>
    <linearGradient id="tSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243256"/>
      <stop offset="0.5" stop-color="#3d3a63"/>
      <stop offset="1" stop-color="#7c4a63"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#tSky)"/>
  <circle cx="270" cy="200" r="60" fill="#f4d68a" opacity="0.9"/>
  <!-- distant skyline -->
  <g fill="#2c3a5e" opacity="0.85">
    <rect x="0" y="440" width="70" height="360"/><rect x="80" y="400" width="55" height="400"/>
    <rect x="145" y="470" width="80" height="330"/><rect x="235" y="420" width="60" height="380"/>
    <rect x="980" y="430" width="70" height="370"/><rect x="1060" y="390" width="55" height="410"/>
    <rect x="1125" y="450" width="75" height="350"/>
  </g>
  <!-- mid skyline -->
  <g fill="#1f2b49">
    <rect x="300" y="500" width="90" height="300"/><rect x="400" y="460" width="70" height="340"/>
    <rect x="820" y="480" width="85" height="320"/><rect x="915" y="520" width="70" height="280"/>
  </g>
  <!-- Tokyo Tower -->
  <g transform="translate(640 0)">
    <g stroke="#d95b4a" stroke-width="6" fill="none">
      <polygon points="0,180 -70,560 70,560"/>
      <line x1="-35" y1="370" x2="35" y2="370"/>
      <line x1="-52" y1="465" x2="52" y2="465"/>
    </g>
    <g stroke="#e8825f" stroke-width="3" opacity="0.8">
      <line x1="-24" y1="270" x2="24" y2="330"/><line x1="24" y1="270" x2="-24" y2="330"/>
      <line x1="-42" y1="380" x2="42" y2="450"/><line x1="42" y1="380" x2="-42" y2="450"/>
    </g>
    <!-- deck -->
    <rect x="-42" y="360" width="84" height="18" fill="#d95b4a"/>
    <rect x="-24" y="262" width="48" height="14" fill="#d95b4a"/>
    <!-- mast -->
    <line x1="0" y1="180" x2="0" y2="110" stroke="#e8825f" stroke-width="5"/>
    <circle cx="0" cy="110" r="6" fill="#f4d68a"/>
    <!-- base building -->
    <rect x="-58" y="560" width="116" height="60" fill="#8a3f38"/>
  </g>
  <!-- foreground buildings with lit windows -->
  <g fill="#141d33">
    <rect x="480" y="560" width="120" height="240"/><rect x="720" y="590" width="120" height="210"/>
  </g>
  <g fill="#f4d68a" opacity="0.85">
    <rect x="498" y="580" width="12" height="16"/><rect x="522" y="580" width="12" height="16"/><rect x="546" y="580" width="12" height="16"/><rect x="570" y="580" width="12" height="16"/>
    <rect x="498" y="616" width="12" height="16"/><rect x="546" y="616" width="12" height="16"/><rect x="570" y="616" width="12" height="16"/>
    <rect x="498" y="652" width="12" height="16"/><rect x="522" y="652" width="12" height="16"/><rect x="570" y="652" width="12" height="16"/>
    <rect x="738" y="610" width="12" height="16"/><rect x="762" y="610" width="12" height="16"/><rect x="810" y="610" width="12" height="16"/>
    <rect x="738" y="646" width="12" height="16"/><rect x="786" y="646" width="12" height="16"/><rect x="810" y="646" width="12" height="16"/>
  </g>
  <!-- neon glow strips -->
  <g opacity="0.6">
    <rect x="300" y="500" width="90" height="6" fill="#e05a8a"/>
    <rect x="820" y="480" width="85" height="6" fill="#4ac1d9"/>
  </g>
</svg>
