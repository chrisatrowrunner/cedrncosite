<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylized view of Rome, Italy">
  <defs>
    <linearGradient id="rSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d79a"/>
      <stop offset="0.55" stop-color="#e0a862"/>
      <stop offset="1" stop-color="#a9713a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#rSky)"/>
  <circle cx="300" cy="230" r="80" fill="#fce7bd" opacity="0.8"/>
  <!-- St Peter's dome in the distance -->
  <g fill="#9c6a3c" opacity="0.55">
    <path d="M210 470 V400 a70 70 0 0 1 140 0 V470 Z"/>
    <rect x="272" y="330" width="16" height="34"/>
    <circle cx="280" cy="322" r="10"/>
  </g>
  <!-- Colosseum -->
  <g>
    <ellipse cx="720" cy="560" rx="440" ry="150" fill="#b07c46"/>
    <path d="M300 560 a420 140 0 0 1 840 0 V520 a420 130 0 0 0 -840 0 Z" fill="#c89258"/>
    <!-- outer wall block -->
    <path d="M330 545 a390 120 0 0 1 780 0 L1110 340 a390 120 0 0 0 -780 0 Z" fill="#caa063"/>
    <!-- arches: three tiers -->
    <g fill="#6f4a28">
      <!-- lower tier -->
      <g>
        <rect x="360" y="470" width="26" height="60" rx="13"/><rect x="430" y="452" width="26" height="72" rx="13"/>
        <rect x="505" y="440" width="26" height="80" rx="13"/><rect x="585" y="432" width="26" height="86" rx="13"/>
        <rect x="668" y="430" width="26" height="86" rx="13"/><rect x="751" y="432" width="26" height="86" rx="13"/>
        <rect x="834" y="440" width="26" height="80" rx="13"/><rect x="912" y="452" width="26" height="72" rx="13"/>
        <rect x="985" y="470" width="26" height="60" rx="13"/>
      </g>
      <!-- upper tier -->
      <g opacity="0.9">
        <rect x="375" y="405" width="22" height="52" rx="11"/><rect x="445" y="392" width="22" height="60" rx="11"/>
        <rect x="518" y="382" width="22" height="66" rx="11"/><rect x="596" y="376" width="22" height="70" rx="11"/>
        <rect x="676" y="374" width="22" height="70" rx="11"/><rect x="756" y="376" width="22" height="70" rx="11"/>
        <rect x="836" y="382" width="22" height="66" rx="11"/><rect x="906" y="392" width="22" height="60" rx="11"/>
        <rect x="976" y="405" width="22" height="52" rx="11"/>
      </g>
    </g>
    <!-- broken top edge -->
    <path d="M330 345 l60 -6 l40 14 l70 -12 l55 8 l80 -10 l90 6 l70 -8 l60 12 l55 -6 l45 10 l30 -4 L1110 345 Z" fill="#caa063"/>
  </g>
  <!-- ground -->
  <path d="M0 640 Q600 600 1200 645 V800 H0 Z" fill="#7c5330"/>
  <!-- umbrella pines -->
  <g fill="#5c4a2c" opacity="0.8">
    <rect x="120" y="560" width="8" height="80"/><ellipse cx="124" cy="552" rx="55" ry="26"/>
    <rect x="1080" y="580" width="7" height="70"/><ellipse cx="1083" cy="574" rx="46" ry="22"/>
  </g>
</svg>
